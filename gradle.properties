org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

TREL_SDK_VERSION=0.2.0

# Maven Central (Sonatype central portal) via com.vanniktech.maven.publish.
# Credentials come from env: ORG_GRADLE_PROJECT_mavenCentralUsername / mavenCentralPassword,
# signing from ORG_GRADLE_PROJECT_signingInMemoryKey / signingInMemoryKeyPassword.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

POM_URL=https://trel.to
POM_SCM_URL=https://github.com/waytodev/trel-android
POM_SCM_CONNECTION=scm:git:git://github.com/waytodev/trel-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/waytodev/trel-android.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=trel
POM_DEVELOPER_NAME=Trel
POM_DEVELOPER_URL=https://trel.to
